# Snakemake >=9 workflow profile for CERN lxbatch (HTCondor), used via:
#   pixi run snakemake --workflow-profile lxbatch --config profile=test --cores 1
#
# This replaces the hand-rolled condor/submit.sh + status.sh + cancel.sh
# wrappers (needed only because the lxplus venv's Snakemake predates the
# executor-plugin system). The plugin owns submission, status polling, and
# retry/cancel handling instead of us.
executor: htcondor
jobs: 5000
max-jobs-per-second: 100
max-status-checks-per-second: 100
restart-times: 3
local-cores: 4
htcondor-jobdir: .condor_jobs
# Worker nodes mount AFS directly, same as the submit host; this stops the
# plugin from adding our own repo's inputs/outputs to transfer_input_files.
htcondor-shared-fs-prefixes: /afs

# Same container mechanism as before (--use-singularity/--singularity-prefix
# on the old Snakemake), just invoked through the profile. Keep this prefix
# off AFS: that's where the AFS-quota/hardlink saga started.
software-deployment-method: apptainer
apptainer-prefix: /eos/home-k/kfilonen/singularity_images

default-resources:
  - getenv=True
  - htcondor_request_mem_mb=1024
  - htcondor_request_disk_mb=2048
  - classad_JobFlavour=espresso
  # Our venv's python comes from the el9-specific LCG view; lxbatch also has
  # el8 execute nodes, and that binary crashes at startup there ("Failed to
  # import encodings module"). Pin to el9 so it always matches its own ABI.
  # (Must be the bare "requirements" key, not "htcondor_submit_requirements"
  # -- the htcondor_submit_ prefix auto-quotes string values, which mangles
  # a boolean expression like this one.)
  - 'requirements=(OpSysAndVer =?= "AlmaLinux9")'
  # HTCondor's default behavior copies the "executable" (here, sys.executable
  # -- our thin AFS venv's python) into an isolated per-job sandbox before
  # running it, even though htcondor-shared-fs-prefixes already stops our own
  # input/output files from being copied. Once copied, the interpreter loses
  # its sibling pyvenv.cfg and can't find its stdlib -- same "Failed to
  # import encodings module" crash as the earlier EosSubmit/--copies problem,
  # different cause. AFS really is shared, so disable transfer entirely.
  - 'htcondor_submit_should_transfer_files=NO'
